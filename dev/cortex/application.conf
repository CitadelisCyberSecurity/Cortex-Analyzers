# Included after the settings the image's entrypoint generates (secret,
# search.uri, job directories, analyzer.urls), so anything here wins.

# Only run analyzers as Docker containers.
job.runners = [docker]

# Analyzer images are built locally (see docker-compose.yml) under the same
# names CI publishes to GHCR, so don't pull them: that would replace the local
# build with the published one.
worker.updateDockerImage = false

# No responders in this repo; don't fetch the public catalog.
responder.urls = []
